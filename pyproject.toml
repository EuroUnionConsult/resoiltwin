[project]
name = "resoiltwin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.43",
    "geoalchemy2==0.15.2",
    "alembic==1.13.2",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.10.1",
    "shapely==2.0.6",
    "pyproj==3.6.1",
    "netCDF4==1.7.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-timeout==2.3.1", "httpx==0.28.1", "ruff==0.6.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
